[project]
name = "llm-mod"
version = "0.1.0"
description = "300M base LLM pretrained from scratch on Apple M5 Max — philosophy, sci-fi, comedy corpus"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.30",
    "torch>=2.6",
    "numpy>=2.0",
    "tokenizers>=0.21",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "transformers>=4.50",
    "safetensors>=0.5",
    "scikit-learn>=1.5",
    "fasttext>=0.9.3",
    "lm-eval>=0.4.8",
    "tqdm>=4.66",
]

[tool.uv]
package = false
